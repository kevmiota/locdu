[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "locdu"
dynamic = ["version"]
description = "ncdu for lines of code: browse where the lines in a codebase are"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Müller" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["loc", "lines of code", "cloc", "ncdu", "tui", "curses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kevmiota/locdu"
Issues = "https://github.com/kevmiota/locdu/issues"

[project.scripts]
locdu = "locdu.cli:main"

[tool.setuptools.dynamic]
version = { attr = "locdu.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
