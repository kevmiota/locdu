name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel with pipx
        run: |
          pipx install dist/*.whl
          locdu --version
          locdu -p .
          pipx uninstall locdu
      - name: Build and install the .deb
        run: |
          deb=$(packaging/build-deb.sh)
          sudo apt-get install -y "$deb"
          /usr/bin/locdu --version
          /usr/bin/locdu -p .
          sudo /usr/bin/locdu -p . >/dev/null
          test -d /usr/lib/python3/dist-packages/locdu/__pycache__
          sudo apt-get remove -y locdu
          test ! -e /usr/lib/python3/dist-packages/locdu
